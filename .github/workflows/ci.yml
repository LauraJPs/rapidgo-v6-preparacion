name: CI RapidGo

run-name: CI RapidGo V6 · ${{ github.event_name }} · ${{ github.actor }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests

      - name: Ejecutar pruebas (contrato + reglas)
        run: pytest -v

      - name: Validar Docker Compose
        run: docker compose config --quiet

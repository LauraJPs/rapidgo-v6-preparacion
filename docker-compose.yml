# RapidGo V6 · Preparación de pedidos
# Semana 2: Kafka + producer + Spark. Semana 3: se agrega Airflow.
name: rapidgo-v6

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Crea los topics con la key/particiones definidas en ADR-001 y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.preparacion.eventos --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.preparacion.alertas --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic rapidgo.preparacion.eventos

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rapidgo-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rapidgo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Simulador de comercios -> Kafka (key = comercio_id)
  producer:
    build: ./producer
    container_name: rapidgo-v6-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: rapidgo.preparacion.eventos
      VELOCIDAD: "2"         # minutos simulados por segundo real (1 min real = 2 h simuladas)
      DURACION_SEG: "0"      # 0 = corre hasta detenerlo
      SEED: "42"
    restart: on-failure

  # Spark Structured Streaming: Kafka -> Data Lake (raw / processed / curated) + alertas
  spark:
    image: spark:${SPARK_VERSION:-4.2.0}-python3
    container_name: rapidgo-v6-spark
    user: "0"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATALAKE: /opt/datalake
    ports:
      - "4040:4040"      # Spark UI
    volumes:
      - ./spark:/opt/app
      - ./datalake:/opt/datalake
      - spark-ivy:/tmp/.ivy2
    command: >
      /opt/spark/bin/spark-submit
      --master local[3]
      --driver-memory 1g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:${SPARK_VERSION:-4.2.0}
      --conf spark.jars.ivy=/tmp/.ivy2
      /opt/app/job_preparacion.py
    restart: on-failure

volumes:
  spark-ivy:

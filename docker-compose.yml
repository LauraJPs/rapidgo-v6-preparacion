# RapidGo V6 · Preparación de pedidos
# Semana 2: Kafka + producer + Spark. Semana 3: Airflow (calidad, KPIs diarios y reporte).
# Semana 4: todo arranca con `docker compose up -d --build` (limpieza automática del Data Lake).
name: rapidgo-v6

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Crea los topics con la key/particiones definidas en ADR-001 y termina.
  # Semana 4: si Kafka arranca vacío (después de `docker compose down`), los offsets y checkpoints
  # guardados en datalake/ ya no corresponden al topic y Spark dejaba de escribir. Por eso, cuando
  # el topic no existía, se limpia el Data Lake antes de crearlo (se conservan los .gitkeep).
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka-init
    user: "0"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./datalake:/opt/datalake
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        TOPICS=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list) || exit 1
        if echo "$$TOPICS" | grep -qx rapidgo.preparacion.eventos; then
          echo "kafka-init: el topic ya existía -> se conserva el Data Lake"
        else
          echo "kafka-init: Kafka nuevo -> se limpia el Data Lake (raw, processed, curated, _checkpoints)"
          rm -rf /opt/datalake/raw/* /opt/datalake/processed/* /opt/datalake/curated/* /opt/datalake/_checkpoints/*
        fi
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.preparacion.eventos --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.preparacion.alertas --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic rapidgo.preparacion.eventos

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rapidgo-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rapidgo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Simulador de comercios -> Kafka (key = comercio_id)
  producer:
    build: ./producer
    container_name: rapidgo-v6-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: rapidgo.preparacion.eventos
      VELOCIDAD: "2"         # minutos simulados por segundo real (1 min real = 2 h simuladas)
      DURACION_SEG: "0"      # 0 = corre hasta detenerlo
      SEED: "42"
    restart: on-failure

  # Spark Structured Streaming: Kafka -> Data Lake (raw / processed / curated) + alertas
  spark:
    image: spark:${SPARK_VERSION:-4.2.0}-python3
    container_name: rapidgo-v6-spark
    user: "0"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datalake-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATALAKE: /opt/datalake
      TRIGGER: "30 seconds"   # 10 s generaba lotes atrasados en laptops
    ports:
      - "4040:4040"      # Spark UI
    volumes:
      - ./spark:/opt/app
      - ./datalake:/opt/datalake
      - spark-ivy:/tmp/.ivy2
    command: >
      /opt/spark/bin/spark-submit
      --master local[3]
      --driver-memory 1g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:${SPARK_VERSION:-4.2.0}
      --conf spark.jars.ivy=/tmp/.ivy2
      /opt/app/job_preparacion.py
    restart: on-failure


  # Semana 3 (fallo real): Spark corre como root y crea curated/ con permisos 755, así que
  # Airflow (uid 50000) no podía crear sus carpetas -> PermissionError. Este servicio crea
  # las carpetas de salida de Airflow con permisos de escritura antes de que arranque.
  datalake-init:
    image: apache/airflow:3.1.8
    container_name: rapidgo-v6-datalake-init
    user: "0:0"
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # crea las carpetas después de la limpieza
    entrypoint: ["bash", "-c"]
    command:
      - >-
        mkdir -p /opt/datalake/curated/kpis_diarios /opt/datalake/curated/alertas_consolidadas
        /opt/datalake/curated/reportes &&
        chmod a+rwx /opt/datalake/curated/kpis_diarios /opt/datalake/curated/alertas_consolidadas
        /opt/datalake/curated/reportes &&
        echo "datalake-init: carpetas de Airflow listas"
    volumes:
      - ./datalake:/opt/datalake

  # Airflow 3 en modo standalone (scheduler + api-server + dag-processor + triggerer en un contenedor)
  airflow:
    image: apache/airflow:3.1.8
    container_name: rapidgo-v6-airflow
    command: standalone
    depends_on:
      datalake-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # entorno local: sin login
      DATALAKE: /opt/datalake
    ports:
      - "8080:8080"      # Airflow UI
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/datalake
    restart: on-failure

volumes:
  spark-ivy:
